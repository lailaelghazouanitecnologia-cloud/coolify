[package]
name = "kornetti"
version = "0.1.0"
edition = "2021"
authors = ["Coolify Team"]
description = "Next-generation cloud deployment platform written in Rust"
license = "Apache-2.0"
repository = "https://github.com/coollabsio/coolify"
keywords = ["cloud", "deployment", "docker", "kubernetes", "infrastructure"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [
    "crates/kornetti-core",
    "crates/kornetti-api",
    "crates/kornetti-cli",
    "crates/kornetti-providers",
    "crates/kornetti-ssh",
    "crates/kornetti-docker",
    "crates/kornetti-proxy",
    "crates/kornetti-scheduler",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# SSH & Remote execution
russh = "0.45"
russh-keys = "0.45"

# Docker
bollard = "0.17"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Cloud provider SDKs
aws-sdk-ec2 = "1.52"
aws-sdk-s3 = "1.54"
aws-config = "1.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Utilities
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
regex = "1.10"
once_cell = "1.19"
dashmap = "6.0"
parking_lot = "0.12"

# Testing
mockall = "0.13"
wiremock = "0.6"
testcontainers = "0.20"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
